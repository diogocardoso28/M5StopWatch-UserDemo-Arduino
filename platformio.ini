[platformio]
default_envs = m5stack-stopwatch

[env:m5stack-stopwatch]
platform = espressif32@6.12.0
board = esp32s3box
framework = arduino

board_build.partitions = partitions.csv
# The upstream IDF table starts ota_0 at 0x20000. PlatformIO otherwise uses
# the esp32s3box default (0x10000), which cannot boot with this table.
board_upload.offset_address = 0x20000

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -I src

lib_deps =
    M5Unified = https://github.com/m5stack/M5Unified.git#0.2.19
    M5GFX = https://github.com/m5stack/M5GFX.git#0.2.26
    LVGL = https://github.com/lvgl/lvgl.git#v9.5.0
    Mooncake = https://github.com/Forairaaaaa/mooncake.git#v2.3.3
    MooncakeLog = https://github.com/Forairaaaaa/mooncake_log.git#v1.5.0
    SmoothUIToolKit = https://github.com/Forairaaaaa/smooth_ui_toolkit.git#v2.12.1

extra_scripts =
    pre:scripts/generate_embedded.py
    post:scripts/fix_upload_layout.py
